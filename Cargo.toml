[package]
name = "dpk-build"
version = "0.1.0"
edition = "2021"
description = "Canonical make b / deliver CLI for DPK repositories"
repository = "https://github.com/dpkimball/dpk-build"
publish = ["dpk"]

# Stop cargo walking into a parent checkout (CI sibling layout / leftover
# GITHUB_WORKSPACE Cargo.toml with registry = "dpk"). Nested test fixtures
# must stay out of this workspace or `cargo test` inside them fails.
[workspace]
exclude = [
    "tests/fixtures/rust_slow",
    "tests/fixtures/fake_project_rust",
    "tests/fixtures/consumers/rust_plain",
]

[[bin]]
name = "dpk-build"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = { version = "0.8", features = ["parse"] }
toml_edit  = "0.22"
indexmap   = { version = "2", features = ["serde"] }
thiserror  = "1"
which      = "4"
ureq       = "2"
tempfile   = "3"
ctrlc      = "3"
fd-lock    = "4"
chrono     = { version = "0.4", features = ["clock"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "fs"] }

[dev-dependencies]
tempfile = "3"
