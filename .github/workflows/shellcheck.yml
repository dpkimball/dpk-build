name: ShellCheck

on:
  push:
    branches: [master, main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch: {}

jobs:
  shellcheck:
    # GitHub-hosted ubuntu-latest fails when account billing/spending limit blocks
    # hosted minutes. Use the QA self-hosted runner (same pattern as sibling repos).
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck on PATH
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v shellcheck >/dev/null 2>&1; then
            ver=v0.10.0
            tmp=$(mktemp -d)
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz" \
              -o "$tmp/sc.tar.xz"
            tar -xJf "$tmp/sc.tar.xz" -C "$tmp"
            mkdir -p "$HOME/.local/bin"
            install -m 755 "$tmp/shellcheck-${ver}/shellcheck" "$HOME/.local/bin/shellcheck"
            rm -rf "$tmp"
          fi
          shellcheck --version

      - name: Run ShellCheck
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          find . -name '*.sh' \
            ! -path './templates/*' \
            | sort \
            | xargs shellcheck --severity=warning
