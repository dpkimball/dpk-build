# Consumer workflow: thin call into dpk-ci security-audit-dispatch.
# Scan execution lives in the Security Audit Kubernetes service (memoryai).
# Generated from security-audit/workflows/templates/security-audit-pr.yml — prefer sync-pr-workflows.py.
#
# Required: vars.SECURITY_AUDIT_API_URL, secrets.SECURITY_AUDIT_API_KEY
#
# PR audits wait until non-security-audit checks for the head SHA have passed
# (or been skipped). Failed CI cancels the audit so runners are not wasted.

name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
      - "**/*.txt"
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  wait-for-ci:
    name: Wait for CI
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Wait for non-audit checks to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"

          is_audit_check() {
            local name="$1"
            local lname
            # Normalize spaces/underscores so case patterns need no spaces
            # (bash case arms cannot contain unquoted spaces).
            lname="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | tr ' _' '--')"
            case "$lname" in
              *security-audit*|*wait-for-ci*) return 0 ;;
              *) return 1 ;;
            esac
          }

          echo "Waiting for CI on ${REPO}@${HEAD_SHA} (excluding security-audit / wait-for-ci)"
          deadline=$((SECONDS + 5400))
          saw_relevant=0

          while (( SECONDS < deadline )); do
            # Check Runs API
            JSON="$(gh api --paginate \
              "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | {name, status, conclusion}]' 2>/dev/null || echo '[]')"

            pending=0
            failed=0
            relevant=0
            while IFS=$'\t' read -r name status conclusion; do
              [[ -z "${name}" ]] && continue
              if is_audit_check "$name"; then
                continue
              fi
              relevant=1
              saw_relevant=1
              st="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
              conc="$(printf '%s' "${conclusion:-}" | tr '[:upper:]' '[:lower:]')"
              case "$st" in
                queued|in_progress|waiting|requested|pending)
                  pending=1
                  echo "pending: ${name} (${st})"
                  ;;
                completed)
                  case "$conc" in
                    success|skipped|neutral) ;;
                    *)
                      echo "::error::CI check failed: ${name} conclusion=${conc}"
                      failed=1
                      ;;
                  esac
                  ;;
              esac
            done < <(printf '%s\n' "$JSON" | jq -r '.[] | [.name, .status, (.conclusion // "")] | @tsv')

            if (( failed )); then
              exit 1
            fi

            if (( relevant == 0 )); then
              # CI may not have registered checks yet; keep waiting briefly.
              if (( saw_relevant == 0 )) && (( SECONDS < 120 )); then
                echo "No non-audit checks yet; waiting for CI to start..."
                sleep 10
                continue
              fi
              echo "No non-audit checks for this SHA (path filters may have skipped CI); proceeding."
              exit 0
            fi

            if (( pending == 0 )); then
              echo "All non-audit checks completed successfully."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for CI checks to finish."
          exit 1

  security-audit:
    name: security-audit
    needs: [wait-for-ci]
    if: always() && (github.event_name != 'pull_request' || needs.wait-for-ci.result == 'success')
    uses: dpkimball/dpk-ci/.github/workflows/security-audit-dispatch.yml@master
    with:
      repository_name: dpk-build
      github_repository: dpkimball/dpk-build
      classification: low
    secrets: inherit
