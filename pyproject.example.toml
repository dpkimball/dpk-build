[project]
name = "example-ai"
version = "0.1.0"
description = "Example AI service using dpk-build deliver pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.26,<2.0",
    "Pillow>=10.0",
    "onnxruntime>=1.18,<2.0",
    "your-image-ai==0.1.0",     # replace with your private package
    "your-services==0.1.0",     # replace with your private package
]

[project.optional-dependencies]
mac = [
    "opencv-python>=4.11.0.86,<5.0.0"
]
linux = [
    "decord>=0.6.0"
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0"
]
develop = [
    "black",
    "build",
    "ruff",
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "twine"
]

[tool.setuptools.packages.find]
exclude = ["design"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_level = "INFO"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.uv.sources]
your-image-ai = { index = "local" }

[[tool.uv.index]]
name = "local"
# Set host/user/password via your operator env — do not commit real LAN credentials.
url = "http://USER:PASSWORD@HOST:PORT/simple"
verify_ssl = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
