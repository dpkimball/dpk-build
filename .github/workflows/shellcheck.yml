name: ShellCheck

on:
  push:
    branches: [master, main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          find . -name '*.sh' \
            ! -path './templates/*' \
            | sort \
            | xargs shellcheck --severity=warning
